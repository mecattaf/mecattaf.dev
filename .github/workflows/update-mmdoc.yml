name: Update mmdoc

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mmdoc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Update the pinned upstream revision
        run: nix flake update mmdoc
      - name: Build the portable mmdoc binary
        run: |
          nix build .#mmdoc-static --out-link mmdoc-static
          install -m 0755 mmdoc-static/bin/mmdoc vendor/mmdoc
      - name: Check the generated site
        run: ./scripts/check.sh
      - name: Commit a tested update
        run: |
          if git diff --quiet -- flake.lock vendor/mmdoc; then
            echo "mmdoc is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock vendor/mmdoc
          git commit -m "Update mmdoc"
          git push origin HEAD:main
